<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0d10;--surface:#16161b;--ink:#f2f2f5;--muted:#9a9aa8;--line:#26262e;--accent:#7c6cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  a{color:inherit;text-decoration:none}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .bar .back{color:var(--muted);font-size:.9rem;margin-right:auto}
  .bar .back:hover{color:var(--ink)}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{font:500 .88rem "Inter",sans-serif;color:var(--muted);background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .open{font-size:.88rem;color:var(--accent);font-weight:600}
  .stage{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:32px 20px 48px}
  .label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:12px;text-align:center}
  .desk{flex:1 1 auto;min-width:0;max-width:1000px}
  .monitor{background:#1f1f26;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4)}
  .chrome{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#24242c;border-bottom:1px solid var(--line)}
  .chrome i{width:10px;height:10px;border-radius:50%}
  .chrome i:nth-child(1){background:#ff5f57}.chrome i:nth-child(2){background:#febc2e}.chrome i:nth-child(3){background:#28c840}
  .url{margin-left:12px;flex:1;background:#17171c;border-radius:6px;padding:4px 12px;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .screen{position:relative;overflow:hidden;background:#fff}
  .screen iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0}
  .mob{flex:0 0 auto}
  .phone{width:399px;padding:12px;border-radius:52px;background:#1f1f26;border:1px solid #33333d;box-shadow:0 30px 60px rgba(0,0,0,.45);position:relative}
  .phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:20px;background:#000;z-index:2}
  .phone iframe{display:block;width:375px;height:780px;border:0;border-radius:40px;background:#fff}
  @media (max-width:1100px){.stage{flex-direction:column;align-items:center}.desk{width:100%}}
  @media (max-width:440px){
    .phone{width:auto;padding:8px;border-radius:40px}
    .phone iframe{width:calc(100vw - 58px);height:640px;border-radius:32px}
  }
  body.only-desk .mob,body.only-mob .desk{display:none}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="index.html">← Portfolio</a>
  <div class="seg" id="sites">
    <button data-s="plumber/">Plumbing & HVAC</button>
    <button data-s="dental/">Dental</button>
  </div>
  <div class="seg" id="views">
    <button data-v="both" class="on">Both</button>
    <button data-v="desk">Desktop</button>
    <button data-v="mob">Mobile</button>
  </div>
  <a class="open" id="open" target="_blank">Open full site ↗</a>
</div>

<div class="stage">
  <div class="desk">
    <div class="label">Desktop · 1280px</div>
    <div class="monitor">
      <div class="chrome"><i></i><i></i><i></i><div class="url" id="url"></div></div>
      <div class="screen" id="screen"><iframe id="fDesk" title="Desktop view"></iframe></div>
    </div>
  </div>
  <div class="mob">
    <div class="label">Mobile · 375px</div>
    <div class="phone"><iframe id="fMob" title="Mobile view"></iframe></div>
  </div>
</div>

<script>
  const fDesk = document.getElementById('fDesk'), fMob = document.getElementById('fMob');
  const screen = document.getElementById('screen');
  const sites = [...document.querySelectorAll('#sites button')].map(b => b.dataset.s);
  function fit(){
    const s = screen.clientWidth / 1280;
    fDesk.style.transform = `scale(${s})`;
    screen.style.height = (800 * s) + 'px';
  }
  new ResizeObserver(fit).observe(screen);
  function show(site){
    fDesk.src = fMob.src = site;
    document.getElementById('open').href = site;
    document.getElementById('url').textContent = new URL(site, location.href).href;
    document.querySelectorAll('#sites button').forEach(b => b.classList.toggle('on', b.dataset.s === site));
    history.replaceState(null, '', '#' + site.replace('/', ''));
  }
  document.querySelectorAll('#sites button').forEach(b => b.onclick = () => show(b.dataset.s));
  document.querySelectorAll('#views button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#views button').forEach(x => x.classList.toggle('on', x === b));
    document.body.className = b.dataset.v === 'both' ? '' : 'only-' + b.dataset.v;
    fit();
  });
  const start = location.hash.slice(1) + '/';
  show(sites.includes(start) ? start : sites[0]);
</script>
</body>
</html>
